var cur = null, ci = 0, gi = 0, score = 0, total = 0, auxSel = null;

function setAux(k){
  auxSel = k;
  auxBtns.h.className = (k === 'h') ? 'sel' : '';
  auxBtns.s.className = (k === 's') ? 'sel' : '';
}

function next(){
  ci = Math.floor(Math.random() * VERBS.length);
  cur = VERBS[ci];
  gi = Math.floor(Math.random() * 3);
  for (var i = 0; i < 3; i++){
    var f = fields[i];
    f.disabled = false;
    f.value = '';
    f.placeholder = '?';
    f.style.background = '#fff';
    f.style.color = '#000';
    if (i === gi){
      f.value = cur[i];
      f.disabled = true;
      f.style.background = '#ececec';
    }
  }
  setAux(null);
  meanEl.textContent = '';
}

function reveal(i){
  var f = fields[i];
  f.value = cur[i];
  f.style.color = '#C62828';
}

function check(){
  var all = true, wrong = 0;
  for (var i = 0; i < 3; i++){
    if (i === gi) continue;
    var f = fields[i];
    var v = (f.value || '').trim();
    if (v === ''){ all = false; wrong++; reveal(i); continue; }
    if (v.toLowerCase() === cur[i].toLowerCase()){
      f.style.color = '#1B7F3B';
    } else {
      all = false; wrong++; reveal(i);
    }
  }
  auxBtns.h.className = '';
  auxBtns.s.className = '';
  var auxOk = (auxSel === cur[3]);
  auxBtns[cur[3]].className = 'ok';

  if (!auxOk){ all = false; wrong++; }
  total++;
  if (all) score++;
  setScore();
  meanEl.textContent = '常见含义：' + MEANINGS[ci];
}

document.getElementById('next').addEventListener('click', next);

auxBtns.s.addEventListener('click', function(){ setAux('s'); });
